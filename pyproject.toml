[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamerv3-minigrid"
version = "0.1.0"
description = "A compact Dreamer-style latent world model for MiniGrid visual navigation"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "gymnasium>=1.0", "minigrid>=2.5", "numpy>=1.26", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
include = ["dreamer*", "envs*"]
